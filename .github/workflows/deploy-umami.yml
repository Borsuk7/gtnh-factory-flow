name: Deploy Umami

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtnh-factory-flow-umami
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Umami analytics to exotiserver
    runs-on: [self-hosted, Linux, X64, gtnh-export]
    steps:
      - uses: actions/checkout@v6

      - name: Start Umami
        run: |
          set -euo pipefail

          umami_root="$HOME/apps/gtnh-factory-flow-umami"
          env_file="$umami_root/.env"
          compose_file="$umami_root/docker-compose.yml"
          mkdir -p "$umami_root"

          if [ ! -f "$env_file" ]; then
            postgres_password="$(openssl rand -hex 24)"
            app_secret="$(openssl rand -hex 32)"
            {
              printf 'POSTGRES_DB=umami\n'
              printf 'POSTGRES_USER=umami\n'
              printf 'POSTGRES_PASSWORD=%s\n' "$postgres_password"
              printf 'APP_SECRET=%s\n' "$app_secret"
              printf 'UMAMI_PORT=8582\n'
              printf 'TRACKER_SCRIPT_NAME=gtnh-stats.js\n'
            } > "$env_file"
          fi

          set_env_var() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" "$env_file"; then
              sed -i "s|^${key}=.*|${key}=${value}|" "$env_file"
            else
              printf '%s=%s\n' "$key" "$value" >> "$env_file"
            fi
          }

          set_env_var BASE_PATH /umami
          set_env_var FAVICON_URL /umami/favicon-32x32.png
          set_env_var UMAMI_BUILD_CONTEXT "$umami_root/source"

          umami_source="$umami_root/source"
          if [ ! -d "$umami_source/.git" ]; then
            rm -rf "$umami_source"
            git clone https://github.com/umami-software/umami.git "$umami_source"
          fi
          git -C "$umami_source" fetch --tags --force
          git -C "$umami_source" checkout --force v3.1.0
          git -C "$umami_source" clean -fdx
          {
            printf 'packages:\n'
            printf "  - '**'\n"
            printf 'dangerouslyAllowAllBuilds: true\n'
          } > "$umami_source/pnpm-workspace.yaml"
          sed -i "s/npm install -g pnpm/npm install -g pnpm@10.23.0/g" "$umami_source/Dockerfile"
          sed -i "s/COPY package.json pnpm-lock.yaml .\//COPY package.json pnpm-lock.yaml pnpm-workspace.yaml .\//g" "$umami_source/Dockerfile"
          sed -i "s/--allow-build='@prisma\/engines'/--allow-build='@prisma\/engines' --allow-build='prisma'/g" "$umami_source/Dockerfile"
          sed -i "/COPY --from=builder --chown=nextjs:nodejs \\/app\\/.next\\/standalone .\\//a RUN pnpm --allow-build='@prisma/engines' --allow-build='prisma' add npm-run-all dotenv chalk semver prisma@7.3.0 @prisma/client@7.3.0 @prisma/adapter-pg@7.3.0" "$umami_source/Dockerfile"
          cp src/app/favicon.ico "$umami_source/public/favicon.ico"
          cp public/icon-512.png "$umami_source/public/favicon-16x16.png"
          cp public/icon-512.png "$umami_source/public/favicon-32x32.png"
          cp public/icon-512.png "$umami_source/public/apple-touch-icon.png"
          python3 - <<'PY'
          import os
          from pathlib import Path

          stats_file = Path(os.environ["HOME"]) / "apps/gtnh-factory-flow-umami/source/src/queries/sql/getWebsiteStats.ts"
          source = stats_file.read_text()
          source, count_patch = source.replace(
              'count(*) as "c",\n        min(website_event.created_at) as "min_time",',
              'sum(case when website_event.event_type = 1 then 1 else 0 end) as "c",\n        min(website_event.created_at) as "min_time",',
          ), source.count('count(*) as "c",\n        min(website_event.created_at) as "min_time",')
          source, duration_patch = source.replace(
              'and website_event.event_type NOT IN (2, 5)\n        ${filterQuery}',
              "and (website_event.event_type NOT IN (2, 5) or website_event.event_name = 'heartbeat')\n        ${filterQuery}",
          ), source.count('and website_event.event_type NOT IN (2, 5)\n        ${filterQuery}')
          if count_patch != 1 or duration_patch < 1:
              raise RuntimeError("Could not patch Umami visit duration query")
          stats_file.write_text(source)
          PY

          cp tools/umami/docker-compose.yml "$compose_file"

          cd "$umami_root"
          docker compose pull db
          docker compose build umami
          docker compose up -d
          docker compose ps

          umami_port="$(grep '^UMAMI_PORT=' "$env_file" | cut -d= -f2)"
          umami_url="http://127.0.0.1:${umami_port}"
          website_id="9c3d7d5b-462b-40f0-9738-f4566f771f49"
          prod_analytics_env="$HOME/apps/gtnh-factory-flow/analytics.env"

          ready=0
          for attempt in $(seq 1 30); do
            if curl -fsS "$umami_url/umami" >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps
            docker compose logs --tail=200 umami
            exit 1
          fi

          mkdir -p "$(dirname "$prod_analytics_env")"
          {
            printf 'NEXT_PUBLIC_UMAMI_SCRIPT_URL=/umami/gtnh-stats.js\n'
            printf 'NEXT_PUBLIC_UMAMI_HOST_URL=/umami\n'
            printf 'NEXT_PUBLIC_UMAMI_WEBSITE_ID=%s\n' "$website_id"
          } > "$prod_analytics_env"

          login_response="$(
            curl -fsS -X POST "$umami_url/umami/api/auth/login" \
              -H 'Content-Type: application/json' \
              --data '{"username":"admin","password":"umami"}' || true
          )"
          token="$(printf '%s' "$login_response" | sed -n 's/.*"token":"\([^"]*\)".*/\1/p')"

          if [ -n "$token" ]; then
            curl -fsS -X POST "$umami_url/umami/api/websites" \
              -H "Authorization: Bearer $token" \
              -H 'Content-Type: application/json' \
              --data "{\"id\":\"$website_id\",\"name\":\"GTNH Planner\",\"domain\":\"gtnh.samiracle.fr\"}" \
              >/dev/null || true
          else
            echo "Could not log in with the initial admin credentials; assuming the website exists or will be created manually."
          fi

          echo "Umami is listening on port ${umami_port}."
          echo "Prod analytics env written to $prod_analytics_env."
          echo "Initial credentials are admin / umami. Change the password after first login."
